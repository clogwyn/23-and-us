# Every push and PR: typecheck, lint, unit/property tests, database security suite.
# Pushes to main: additionally apply any new migrations to the live Supabase project.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The security suite runs a throwaway Postgres; make sure server binaries exist.
      - name: Ensure Postgres server binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          ls /usr/lib/postgresql/*/bin/initdb

      - run: pnpm check

      - name: Build the web app
        run: pnpm --filter @23andus/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  integration:
    # Full local Supabase (Postgres 17, auth, API, storage, realtime) in Docker:
    # applies every migration, then runs the app's save/load, security and storage tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start local Supabase
        working-directory: packages/db
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor
      - name: Run integration tests
        working-directory: packages/db
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          cd ../../apps/web && pnpm test:integration
      - name: Stop local Supabase
        if: always()
        working-directory: packages/db
        run: supabase stop --no-backup

  migrate:
    # Only main is ever deployed. Runs after checks and integration pass; a no-op when nothing is pending.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false # never interrupt a migration
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secret is configured
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — see docs/operations.md"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Pending migrations
        working-directory: packages/db
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        working-directory: packages/db
        run: supabase db push --db-url "$SUPABASE_DB_URL"
